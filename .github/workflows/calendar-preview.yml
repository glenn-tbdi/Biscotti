name: Calendar preview
on:
  push:
    branches: [platform/biscotti-calendar-preview]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  mac-preview:
    name: Package Apple Silicon preview
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the ad hoc app
        working-directory: App
        run: |
          # Match the app CI's headless-runner icon workaround.
          rm -rf Resources/AppIcon.icon
          xcodegen generate
          xcodebuild -quiet -project Biscotti.xcodeproj -scheme Biscotti \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BiscottiDerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" build
      - name: Verify and package the app
        run: |
          app="$RUNNER_TEMP/BiscottiDerivedData/Build/Products/Debug/Biscotti.app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$RUNNER_TEMP/biscotti-preview"
          ditto "$app" "$RUNNER_TEMP/biscotti-preview/Biscotti.app"
          hdiutil create -volname 'Biscotti Calendar Preview' \
            -srcfolder "$RUNNER_TEMP/biscotti-preview" -format UDZO \
            "$RUNNER_TEMP/Biscotti-Calendar-Preview.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Biscotti-Calendar-Preview
          path: ${{ runner.temp }}/Biscotti-Calendar-Preview.dmg
          if-no-files-found: error
          retention-days: 7
